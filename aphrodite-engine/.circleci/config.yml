version: 2.1

jobs:
  aphrodite-engine:
    docker:
      - image: opencog/opencog-deps
        user: root
        environment:
          CCACHE_DIR: /ws/ccache
    working_directory: /ws/aphrodite-engine
    steps:
      - attach_workspace:
          at: /ws
      - run:
          name: Start restoring ccache
          command: date +%d-%m-%Y > /tmp/date
      - restore_cache:
          keys:
            - ccache-{ checksum "/tmp/date" }
            - ccache-
      - checkout
      - run:
          name: CMake Configure
          command: mkdir -p build && cd build && cmake ..
      - run:
          name: Build
          command: cd build && make -j2
      - run:
          name: Build tests
          command: cd build && make -j2 tests
          when: always
      - run:
          name: Run tests
          command: cd build && make check ARGS=-j2
          when: always
      - run:
          name: Print test log
          command: cat build/tests/Testing/Temporary/LastTest.log
          when: always
      - run:
          name: Install aphrodite-engine
          command: cd build && make install && ldconfig
      - persist_to_workspace:
          root: /ws/
          paths:
            - aphrodite-engine
            - ccache
      - run:
          name: Start storing ccache
          command: date +%d-%m-%Y > /tmp/date
      - save_cache:
          key: ccache-{{ checksum "/tmp/date" }}
          paths:
            - /ws/ccache

workflows:
  version: 2
  build-test:
    jobs:
      - aphrodite-engine
