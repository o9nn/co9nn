workflows:
  version: 2
  build-test-monorepo:
    jobs:
      # Layer 1: Foundation
      - cogutil

      # Layer 2: Core (parallel, all require cogutil)
      - atomspace:
          requires:
            - cogutil
      - coggml:
          requires:
            - cogutil
      - moses:
          requires:
            - cogutil
      - hurdcog:
          requires:
            - cogutil
      - cognumach:
          requires:
            - cogutil

      # Layer 3: AtomSpace dependents (parallel, require atomspace)
      - atomspace-storage:
          requires:
            - atomspace
      - matrix:
          requires:
            - atomspace
      - unify:
          requires:
            - atomspace
      - sensory:
          requires:
            - atomspace
      - tensor-logic:
          requires:
            - atomspace
      - atenspace:
          requires:
            - atomspace
      - atomspace-accelerator:
          requires:
            - atomspace

      # Layer 4: Storage backends (parallel, require atomspace-storage)
      - atomspace-rocks:
          requires:
            - atomspace-storage
      - atomspace-cog:
          requires:
            - atomspace-storage
      - atomspace-pgres:
          requires:
            - atomspace-storage
      - atomspace-restful:
          requires:
            - atomspace-storage
      - atomspace-dht:
          requires:
            - atomspace-storage
      - atomspace-ipfs:
          requires:
            - atomspace-storage
      - atomspace-metta:
          requires:
            - atomspace-storage
      - atomspace-websockets:
          requires:
            - atomspace-storage
      - atomspace-rpc:
          requires:
            - atomspace-storage
      - atomspace-agents:
          requires:
            - atomspace-storage
      - atomspace-bridge:
          requires:
            - atomspace-storage
      - lg-atomese:
          requires:
            - atomspace-storage

      # Layer 5: CogServer (requires atomspace + atomspace-storage)
      - cogserver:
          requires:
            - atomspace
            - atomspace-storage

      # Layer 6: URE (requires atomspace + unify)
      - ure:
          requires:
            - atomspace
            - unify

      # Layer 7: CogServer dependents (parallel, require cogserver)
      - learn:
          requires:
            - cogserver
      - agents:
          requires:
            - cogserver
      - agentic-chatbots:
          requires:
            - cogserver

      # Layer 8: Attention (requires cogserver + atomspace-storage)
      - attention:
          requires:
            - cogserver
            - atomspace-storage

      # Layer 9: URE dependents (parallel, require ure)
      - miner:
          requires:
            - ure
      - pln:
          requires:
            - ure
      - asmoses:
          requires:
            - cogutil
            - atomspace
            - ure

      # Layer 10: SpaceTime (requires atomspace + attention)
      - spacetime:
          requires:
            - atomspace
            - attention

      # Layer 11: CogSelf (requires coggml)
      - cogself:
          requires:
            - coggml

      # Layer 12: Final opencog build
      - opencog:
          requires:
            - cogserver
            - attention
            - spacetime
            - pln
            - lg-atomese
            - ure

      # Package release (master branch only)
      - package:
          requires:
            - opencog
          filters:
            branches:
              only: master
