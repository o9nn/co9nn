version: 2.1

# OCC Monorepo Master Orchestration Config
# Build dependency order enforced via 'requires' in workflow section.

executors:
  opencog-deps:
    docker:
      - image: opencog/opencog-deps
        user: root
        environment:
          CCACHE_DIR: /ws/ccache

commands:
  restore-ccache:
    steps:
      - run:
          name: Prepare ccache key
          command: mkdir -p /ws && date +%d-%m-%Y > /ws/date
      - restore_cache:
          keys:
            - ccache-{{ checksum "/ws/date" }}
            - ccache-

  save-ccache:
    steps:
      - run:
          name: Prepare ccache key
          command: mkdir -p /ws && date +%d-%m-%Y > /ws/date
      - save_cache:
          key: ccache-{{ checksum "/ws/date" }}
          paths:
            - /ws/ccache

  build-cmake-pkg:
    parameters:
      pkg:
        type: string
    steps:
      - run:
          name: CMake Configure
          command: mkdir -p /ws/<< parameters.pkg >>/build && cd /ws/<< parameters.pkg >>/build && cmake ..
      - run:
          name: Build
          command: cd /ws/<< parameters.pkg >>/build && make -j2
      - run:
          name: Build tests
          command: cd /ws/<< parameters.pkg >>/build && make -j2 tests
          when: always
      - run:
          name: Run tests
          command: cd /ws/<< parameters.pkg >>/build && make check ARGS=-j2
          when: always
      - run:
          name: Print test log
          command: cat /ws/<< parameters.pkg >>/build/tests/Testing/Temporary/LastTest.log
          when: always
      - run:
          name: Install << parameters.pkg >>
          command: cd /ws/<< parameters.pkg >>/build && make install && ldconfig

jobs:
  # =========================================================================
  # Layer 1: Foundation - cogutil (no dependencies)
  # =========================================================================
  cogutil:
    executor: opencog-deps
    working_directory: /ws
    steps:
      - run:
          name: Ensure /ws directory exists
          command: mkdir -p /ws
      - restore-ccache
      - run:
          name: Checkout cogutil code
          command: |
            mkdir -p /ws/cogutil
            cd /ws
            git clone --depth 1 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - build-cmake-pkg:
          pkg: cogutil
      - persist_to_workspace:
          root: /ws
          paths:
            - cogutil
            - ccache
      - save-ccache

  # =========================================================================
  # Layer 2: Core (require cogutil)
  # =========================================================================
  atomspace:
    executor: opencog-deps
    working_directory: /ws/atomspace
    steps:
      - attach_workspace:
          at: /ws
      - restore-ccache
      - run:
          name: Install cogutil
          command: cd /ws/cogutil/build && make install && ldconfig
      - checkout
      - build-cmake-pkg:
          pkg: atomspace
      - persist_to_workspace:
          root: /ws
          paths:
            - atomspace
            - ccache
      - save-ccache

  coggml:
